<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas Estructuras 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: barra de herramientas arriba · panel lateral de propiedades · lienzo 3D SVG · panel de resultados abajo (misma dinámica que Hydra). */
:root{
  color-scheme:dark;
  --bg:#09090b;--bg2:#111113;--bg3:#18181b;--bg4:#202024;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --text:#e4e4e7;--muted:#8a8a93;--faint:#4b4b53;
  --accent:#2dd4bf;--accent-d:rgba(45,212,191,.11);--accent-b:rgba(45,212,191,.32);
  --steel:#7aa2d6;--load:#f59e0b;--load-d:rgba(245,158,11,.12);
  --ok:#4ade80;--ok-d:rgba(74,222,128,.12);--warn:#f59e0b;--bad:#f87171;--bad-d:rgba(248,113,113,.12);
  --violet:#a78bfa;--grid:rgba(148,163,184,.10);--grid2:rgba(148,163,184,.22);
  --node:#e4e4e7;--node-fill:#0b0f17;--canvas:#0a0a0c;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tb-h:46px;--sb-w:292px;--res-h:34vh;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f5f7;--bg2:#ffffff;--bg3:#eef1f4;--bg4:#e3e8ed;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.16);
  --text:#16181d;--muted:#5d6672;--faint:#9aa3ae;
  --accent:#0f8f80;--accent-d:rgba(15,143,128,.10);--accent-b:rgba(15,143,128,.35);
  --steel:#2f5f9e;--load:#b86e00;--load-d:rgba(184,110,0,.10);
  --ok:#15803d;--ok-d:rgba(21,128,61,.10);--warn:#b86e00;--bad:#c2410c;--bad-d:rgba(194,65,12,.10);
  --violet:#6d4fd8;--grid:rgba(15,23,42,.07);--grid2:rgba(15,23,42,.16);
  --node:#16181d;--node-fill:#ffffff;--canvas:#fbfcfd;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5f7;--bg2:#ffffff;--bg3:#eef1f4;--bg4:#e3e8ed;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.16);
  --text:#16181d;--muted:#5d6672;--faint:#9aa3ae;
  --accent:#0f8f80;--accent-d:rgba(15,143,128,.10);--accent-b:rgba(15,143,128,.35);
  --steel:#2f5f9e;--load:#b86e00;--load-d:rgba(184,110,0,.10);
  --ok:#15803d;--ok-d:rgba(21,128,61,.10);--warn:#b86e00;--bad:#c2410c;--bad-d:rgba(194,65,12,.10);
  --violet:#6d4fd8;--grid:rgba(15,23,42,.07);--grid2:rgba(15,23,42,.16);
  --node:#16181d;--node-fill:#ffffff;--canvas:#fbfcfd;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;overflow:hidden}
button,input,select{font-family:var(--mono);font-size:11px;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding-inline:16px;padding-block:0;gap:0}

/* ── barra de herramientas ── */
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;row-gap:5px;min-height:var(--tb-h);padding-block:5px;border-bottom:1px solid var(--line2);min-width:0}
.logo{font-family:var(--sans);font-weight:700;letter-spacing:.16em;color:var(--accent);font-size:14px;white-space:nowrap;padding-right:4px}
.logo small{font-family:var(--mono);font-weight:500;color:var(--muted);letter-spacing:.05em;font-size:9px;margin-left:4px}
.sep{width:1px;height:22px;background:var(--line2);flex:none}
.grp{display:flex;gap:3px;align-items:center;flex:none}
.lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.tb{height:28px;padding:0 9px;border:1px solid var(--line2);border-radius:3px;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:color .12s,border-color .12s,background .12s}
.tb:hover{color:var(--accent);border-color:var(--accent)}
.tb.on{color:var(--accent);border-color:var(--accent);background:var(--accent-d)}
.tb.go{color:var(--ok);border-color:var(--ok)}
.tb.go:hover{background:var(--ok-d)}
.tb:disabled{opacity:.35;cursor:default}
.tb kbd{font-family:var(--mono);font-size:9px;color:var(--faint)}
.num-in{width:74px;height:28px;background:var(--bg3);border:1px solid var(--line2);border-radius:3px;padding:0 6px;text-align:right}
.sel-in{height:28px;background:var(--bg3);border:1px solid var(--line2);border-radius:3px;padding:0 4px}
.right{margin-left:auto;display:flex;gap:4px;align-items:center;flex:none}
.status{font-size:10px;padding:3px 8px;border-radius:3px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.status.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-d)}
.status.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-d)}
.status.warn{color:var(--warn);border-color:var(--warn);background:var(--load-d)}

/* ── área principal ── */
.main{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--res-h);min-height:0}
.side{grid-row:1/3;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;padding:9px 4px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;padding:12px 14px;min-height:0}
.pane[hidden]{display:none!important}
.hdr{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.hdr::after{content:"";flex:1;height:1px;background:var(--line)}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;min-width:0}
.field label,.flab{font-size:10px;color:var(--muted)}
.field input,.field select{width:100%;height:27px;background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:0 7px}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.chk{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text);margin-bottom:6px;cursor:pointer}
.dofs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:8px}
.dof{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--muted);background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:4px 0;cursor:pointer}
.dof input{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{height:24px;padding:0 8px;border:1px solid var(--line2);border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-size:10px}
.chip:hover,.chip.on{color:var(--accent);border-color:var(--accent);background:var(--accent-d)}
.btn{width:100%;height:28px;border:1px dashed var(--line2);border-radius:3px;background:none;color:var(--muted);cursor:pointer;margin-bottom:6px}
.btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-d)}
.btn.danger:hover{color:var(--bad);border-color:var(--bad);background:var(--bad-d)}
.note{font-size:10px;color:var(--muted);line-height:1.6;background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:7px 9px;margin-bottom:10px}
.empty{color:var(--faint);text-align:center;padding:26px 8px;line-height:1.8;font-size:11px}
.phead{border-left:3px solid var(--accent);background:var(--bg3);padding:7px 10px;border-radius:2px;margin-bottom:10px}
.phead .t{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.phead .n{font-size:12px;font-weight:600;font-family:var(--sans)}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:11px;margin-bottom:10px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-variant-numeric:tabular-nums;text-align:right}
.list-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line);border-radius:3px;margin-bottom:4px;cursor:pointer;background:var(--bg3)}
.list-item:hover{border-color:var(--line2)}
.list-item.sel{border-color:var(--accent);background:var(--accent-d)}
.list-item .dot{width:8px;height:8px;border-radius:2px;flex:none}
.list-item .a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .b{font-size:10px;color:var(--muted);white-space:nowrap}

/* ── lienzo ── */
.canvas{position:relative;background:var(--canvas);min-width:0;min-height:0;overflow:hidden;touch-action:none}
#view{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
#view.m-node{cursor:crosshair}#view.m-bar{cursor:crosshair}#view.m-pan{cursor:grab}#view.m-orbit{cursor:move}#view .mem line{transition:none}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--line2);border-radius:4px;padding:5px 12px;font-size:10px;color:var(--muted);pointer-events:none;white-space:nowrap;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis}
.readout{position:absolute;left:10px;bottom:10px;font-size:10px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:4px 8px;pointer-events:none;font-variant-numeric:tabular-nums}
.plane-tag{position:absolute;left:10px;top:10px;font-size:10px;color:var(--accent);background:var(--bg2);border:1px solid var(--accent-b);border-radius:3px;padding:4px 8px;pointer-events:none}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:3px}
.zb{width:28px;height:28px;border:1px solid var(--line2);border-radius:3px;background:var(--bg2);color:var(--muted);cursor:pointer;font-size:14px}
.zb:hover{color:var(--accent);border-color:var(--accent)}
.legend{position:absolute;right:10px;top:10px;font-size:10px;color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:220px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* ── resultados ── */
.res{border-top:1px solid var(--line2);background:var(--bg2);display:flex;flex-direction:column;min-height:0;min-width:0}
.res .tabs{justify-content:flex-start}
.res .tab{flex:none;padding:8px 14px}
.rpane{flex:1;overflow:auto;padding:10px 14px;min-height:0}
.rpane[hidden]{display:none!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin-bottom:10px}
.kpi{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:7px 10px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--line)}
.kpi.ok::after{background:var(--ok)}.kpi.warn::after{background:var(--warn)}.kpi.bad::after{background:var(--bad)}
.kpi .l{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.kpi .v{font-family:var(--sans);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .v small{font-family:var(--mono);font-size:9px;color:var(--muted);margin-left:3px;font-weight:400}
.kpi .s{font-size:9px;color:var(--muted);margin-top:2px}
.msgs{display:flex;flex-direction:column;gap:5px}
.msg{font-size:11px;line-height:1.55;padding:6px 10px;border-radius:3px;border:1px solid var(--line);background:var(--bg3)}
.msg.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-d)}
.msg.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-d)}
.msg.warn{border-color:var(--warn);color:var(--warn);background:var(--load-d)}
.tw{overflow:auto;max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:11px;font-variant-numeric:tabular-nums}
table.t th{position:sticky;top:0;background:var(--bg4);color:var(--muted);font-weight:500;font-size:9px;letter-spacing:.06em;padding:5px 8px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t th:first-child,table.t td:first-child,table.t th.l,table.t td.l{text-align:left}
table.t td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t tr:hover td{background:var(--accent-d)}
table.t tr.sel td{background:var(--accent-d)}
.pill{display:inline-block;font-size:9px;padding:1px 6px;border-radius:9px;border:1px solid var(--line2);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-d)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-d)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--load-d)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bg2);border:1px solid var(--accent);color:var(--text);padding:7px 14px;border-radius:4px;font-size:11px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.dlg[hidden]{display:none!important}
.dlg .box{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:18px;max-width:420px;width:100%}
.dlg .box h3{font-family:var(--sans);font-size:14px;margin:0 0 8px}
.dlg .box p{color:var(--muted);line-height:1.6;margin:0 0 14px;font-size:11px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}

@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto auto}
  .side{grid-row:auto;border-right:0;border-top:1px solid var(--line);max-height:none}
  .canvas{grid-row:1}
  .res{grid-row:3;min-height:320px}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ── ejercicios de verificación ── */
.dlg .box.wide{max-width:1160px;width:100%;height:min(90vh,860px);display:flex;flex-direction:column;padding:0;overflow:hidden}
.bx-head{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.bx-head h3{margin:0}
.bx-head .sp{flex:1}
.bx-body{flex:1;display:grid;grid-template-columns:310px minmax(0,1fr);min-height:0}
.bx-list{overflow:auto;border-right:1px solid var(--line2);padding:6px 8px 12px}
.bx-det{overflow:auto;padding:14px 18px 22px}
.bx-det p{color:var(--text);font-size:11.5px;line-height:1.65;margin:0 0 10px}
.bx-gh{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:12px 4px 4px}
.bx-it{display:flex;gap:7px;align-items:flex-start;padding:6px 7px;border-radius:3px;cursor:pointer;border:1px solid transparent}
.bx-it:hover{background:var(--accent-d)}
.bx-it.on{background:var(--accent-d);border-color:var(--accent-b)}
.bx-it .pill{flex:none;margin-top:1px}
.bx-id{font-family:var(--mono);font-size:10px;color:var(--accent);min-width:30px;flex:none}
.bx-t{flex:1;min-width:0;font-size:11px;line-height:1.4}
.bx-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
@media (max-width:760px){.bx-body{grid-template-columns:1fr;grid-template-rows:34% 1fr}.bx-list{border-right:0;border-bottom:1px solid var(--line2)}}

/* ── v2: detalles plegables, uniones, cargas, combinaciones ── */
details.dt{border:1px solid var(--line);border-radius:3px;background:var(--bg3);margin-bottom:8px;padding:0 8px}
details.dt>summary{cursor:pointer;font-size:10px;color:var(--muted);padding:6px 0;list-style:none;display:flex;align-items:center;gap:6px;line-height:1.4}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::before{content:"▸";color:var(--accent);font-size:9px;flex:none}
details.dt[open]>summary::before{content:"▾"}
details.dt[open]>summary{color:var(--text);border-bottom:1px solid var(--line);margin-bottom:8px}
details.dt .chip{margin-left:auto;height:20px;padding:0 6px}
details.dt .field input,details.dt .field select{background:var(--bg2)}
details.dt .btn{margin-top:4px}
.jt{border-left:2px solid var(--line2);padding-left:8px;margin-bottom:8px}
.field select{width:100%;height:27px;background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.cb-body{flex:1;overflow:auto;padding:14px 18px 22px;min-height:0}
.cb-body table.t input,.cb-body table.t select{height:24px;background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.cb-body details.dt{margin-top:12px;padding:0 12px}
.cb-body .field input,.cb-body .field select{width:100%;height:27px;background:var(--bg3);border:1px solid var(--line);border-radius:3px;padding:0 7px}
.cb-body .btn{margin-top:6px;max-width:520px}
.pane .msg{margin-bottom:6px}
</style>
</head>
<body>


<div class="app">
  <div class="toolbar" id="toolbar">
    <span class="logo">ATLAS<small>3D · v2</small></span>
    <span class="sep"></span>
    <span class="lbl">Modo</span>
    <div class="grp" id="modes">
      <button class="tb on" data-mode="select" title="Seleccionar y mover (S)">↖ Seleccionar <kbd>S</kbd></button>
      <button class="tb" data-mode="node" title="Agregar nudo (N)">● Nudo <kbd>N</kbd></button>
      <button class="tb" data-mode="bar" title="Dibujar barras encadenadas (B)">╱ Barra <kbd>B</kbd></button>
      <button class="tb" data-mode="orbit" title="Rotar la vista (O · también clic derecho)">⟲ Orbitar <kbd>O</kbd></button>
      <button class="tb" data-mode="pan" title="Mover la vista (P · también rueda apretada)">✥ Pan <kbd>P</kbd></button>
    </div>
    <select class="sel-in" id="tbSec" title="Perfil con el que se dibujan las barras nuevas" aria-label="Perfil de dibujo"></select>
    <span class="sep"></span>
    <span class="lbl">Plano</span>
    <div class="grp" id="planes">
      <button class="tb on" data-plane="XY" title="Plano horizontal (planta) · Z = valor">XY</button>
      <button class="tb" data-plane="XZ" title="Plano vertical Este-Oeste · Y = valor">XZ</button>
      <button class="tb" data-plane="YZ" title="Plano vertical Norte-Sur · X = valor">YZ</button>
      <input class="num-in" id="planeVal" type="text" inputmode="decimal" value="0" title="Posición del plano de trabajo (mm)" aria-label="Posición del plano de trabajo en mm">
      <button class="tb" id="planeFromNode" title="Llevar el plano al nudo seleccionado">⇣ nudo</button>
    </div>
    <span class="sep"></span>
    <span class="lbl">Grilla</span>
    <div class="grp">
      <select class="sel-in" id="gridStep" title="Paso de grilla y snap" aria-label="Paso de grilla">
        <option value="10">10 mm</option><option value="50">50 mm</option><option value="100">100 mm</option>
        <option value="250" selected>250 mm</option><option value="500">500 mm</option><option value="1000">1000 mm</option>
      </select>
      <button class="tb on" id="snapBtn" title="Ajuste a grilla y nudos">⌗ Snap</button>
    </div>
    <span class="sep"></span>
    <span class="lbl">Vista</span>
    <div class="grp" id="views">

}

/* ───────────── Cb a partir del diagrama de momentos real (LRFD-99 F1.2a: Cb = 12,5·Mmax/(2,5·Mmax + 3·MA + 4·MB + 3·MC) ≤ 2,3) ───────────── */
function momentFn(R, mr, fct) {
  const src = solsFor(R, mr, fct);
  return x => { let m = 0; for (const {f, sol} of src) m += f * planeEval(sol.SY, sol.stY, x).M; return m; };
}
function cbSegment(ev, S, a, b) {
  const l = b - a; if (!(l > 0)) return 1;
  const MA = Math.abs(ev(a + l / 4)), MB = Math.abs(ev(a + l / 2)), MC = Math.abs(ev(a + 3 * l / 4));
  let Mmax = Math.max(MA, MB, MC, Math.abs(ev(a)), Math.abs(ev(b)));
  for (let k = 0; k < S.x.length; k++) if (S.x[k] >= a - 1e-9 && S.x[k] <= b + 1e-9) Mmax = Math.max(Mmax, Math.abs(S.Mz[k]));
  if (Mmax < 1e-6) return 1;
  return Math.min(2.3, 12.5 * Mmax / (2.5 * Mmax + 3 * MA + 4 * MB + 3 * MC));
}
function cbMember(R, mr, fct, S, lb, opts) {
  if (opts.override > 0) return opts.override;
  if (opts.unit || opts.cant) return 1;
  const L = mr.L, ev = momentFn(R, mr, fct), n = lb >= L * (1 - 1e-6) ? 1 : Math.ceil(L / lb - 1e-9);
  let cb = Infinity; for (let i = 0; i < n; i++) cb = Math.min(cb, cbSegment(ev, S, L * i / n, L * (i + 1) / n));
  return cb;
}

/* ───────────── verificación de todas las barras ───────────── */
function checkAll(st, R) {

  const cbUnit = (st.settings && st.settings.cbMode === 'unit');
  const deg = new Map(); st.members.forEach(m => { deg.set(m.i, (deg.get(m.i) || 0) + 1); deg.set(m.j, (deg.get(m.j) || 0) + 1); });
  const free = n => !n.sup || !n.sup.some(v => v);
  R.checks = []; R.defl = [];
  for (const mr of R.mrec) {
    const m = mr.m, P = mr.P; const rec = {mr, id: m.id, tag: m.tag || '', sec: m.sec, L: mr.L, rigid: P.rigid};
    const iDeg = deg.get(m.i) || 0, jDeg = deg.get(m.j) || 0, ni = st.nodes[mr.a], nj = st.nodes[mr.b];
    let cant = 0; if (iDeg === 1 && free(ni)) cant = 1; else if (jDeg === 1 && free(nj)) cant = 2;   // 1: extremo libre = i ; 2: libre = j
    if (!P.rigid) {
      const [kls, klw, lb] = effLens(m, mr.L); const cap = memberCapacity(R, P, kls, klw, lb); rec.cap = cap; rec.best = null; rec.cant = cant;
      for (const {c, i} of uls) {
        const S = memberStations(R, mr, c.f, 21);
        const Cb = cbMember(R, mr, c.f, S, lb, {override: m.cb, unit: cbUnit, cant});
        let bestSt = null, Pc = 0, Pt = 0, Ms = 0, Mw = 0;
        for (let k = 0; k < S.x.length; k++) {
          const N = S.N[k], Pu = Math.max(0, -N), Tu = Math.max(0, N), mz = S.Mz[k], mw = Math.abs(S.My[k]);
          Pc = Math.max(Pc, Pu); Pt = Math.max(Pt, Tu); Ms = Math.max(Ms, Math.abs(mz)); Mw = Math.max(Mw, mw);
          const sgn = mz >= 0 ? 1 : -1, pr = Pu / cap.Py / PHI_B;
          const en = cap.MnS(Cb, sgn, pr), phiMs = PHI_B * en.Mn;

          const ra = Pu > 0 ? Pu / cap.phiPc : Tu / cap.phiPt;
          const rH = ra >= 0.2 ? ra + 8 / 9 * mom : ra / 2 + mom;
          if (!bestSt || rH > bestSt.rH) bestSt = {rH, k, x: S.x[k], Pu, Tu, mz, mw, phiMs, gov: en.gov, ra, mom, eq: ra >= 0.2 ? 'H1-1a' : 'H1-1b'};
        }

        const rV = Math.max(Vs / cap.phiVs, Vw / cap.phiVw), rH = bestSt ? bestSt.rH : 0, r = Math.max(rH, rV);
        const o = {combo: c.n, ci: i, Pc, Pt, Ms, Mw, Vs, Vw, T, rH, rV, r, Cb, x: bestSt ? bestSt.x : 0, gov: bestSt, phiMsUsed: bestSt ? bestSt.phiMs : cap.phiMs};
        if (R.order >= 2 && R.soMap) {                       // amplificación de los efectos por segundo orden (respecto de la misma combinación en primer orden)
          const S1 = memberStations(R, mr, c.f.slice(), 21), a1 = mxabs(S1.Mz), a2 = mxabs(S1.My);
          o.ampS = a1 > 1e-3 * Math.max(1, Ms) ? Ms / a1 : 1; o.ampW = a2 > 1e-3 * Math.max(1, Mw) ? Mw / a2 : 1; o.amp = Math.max(o.ampS, o.ampW);
          const n1 = Math.max(0, ...S1.N.map(v => -v)); o.ampN = n1 > 1e-3 * Math.max(1, Pc) ? Pc / n1 : 1;
        }
        if (!rec.best || r > rec.best.r) rec.best = o;

    } else rec.r = 0;
    R.checks.push(rec);
    // flechas de servicio
    if (!P.rigid) {
      for (const {c, i} of sls) {

        if (!cant) for (let k = 0; k < S.x.length; k++) {
          const x = S.x[k], ry = S.vy[k] - (S.vy[0] + (S.vy[S.vy.length - 1] - S.vy[0]) * x / L), rz = S.vz[k] - (S.vz[0] + (S.vz[S.vz.length - 1] - S.vz[0]) * x / L);

}

function kpi(l, v, u, cls, sub) { return `<div class="kpi ${cls || ''}"><div class="l">${l}</div><div class="v">${v}<small>${u || ''}</small></div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`; }
function bomData() {

    const add = (map, key, extra) => { let r = map.get(key); if (!r) { r = Object.assign({n: 0, L: 0, kg: 0, lens: []}, extra); map.set(key, r); } r.n++; r.L += L; r.kg += w; r.lens.push(Math.round(L)); };
    add(rows, m.sec, {sec: m.sec, kgm: P.kg, rigid: P.rigid}); add(tags, (m.tag || '—') + '|' + m.sec, {tag: m.tag || '—', sec: m.sec, kgm: P.kg, rigid: P.rigid});

}

/* ════════════════════════════════════════════════════════════════════════════
   EJERCICIOS DE VERIFICACIÓN · motor
   Cada ejercicio define: parámetros (valores o fórmulas), un modelo, y una lista de
   comprobaciones «valor teórico (fórmula o dato publicado) vs. valor del programa».
   Las fórmulas se escriben con sintaxis de Excel (^, SQRT(), PI(), IF(), …) para que el
   mismo texto sirva en la app y en el informe Excel.
   Unidades de entrada de las fórmulas: mm · N · MPa (cargas de usuario en kN y kN/m);
   resultados comparados en mm, rad, kN, kN·m.
   ════════════════════════════════════════════════════════════════════════════ */
const BENCH = [];
const BENCH_FN = {SQRT: Math.sqrt, SIN: Math.sin, COS: Math.cos, TAN: Math.tan, ATAN: Math.atan, ABS: Math.abs, EXP: Math.exp, LN: Math.log, MIN: Math.min, MAX: Math.max, PI: () => Math.PI, IF: (c, a, b) => c ? a : b};
const _benchCache = new Map();
function benchEval(expr, vals) {
  const names = Object.keys(vals), key = expr + '|' + names.join(',');
  let f = _benchCache.get(key);
  if (!f) { f = new Function(...Object.keys(BENCH_FN), ...names, '"use strict"; return (' + String(expr).replace(/\^/g, '**') + ');'); _benchCache.set(key, f); }
  return f(...Object.values(BENCH_FN), ...names.map(n => vals[n]));
}
function benchParams(ex) {
  const vals = {}, rows = [];
  for (const [name, spec, unit, desc] of ex.params) {
    const v = typeof spec === 'number' ? spec : benchEval(spec, vals);
    vals[name] = v; rows.push({name, expr: typeof spec === 'string' ? spec : null, value: v, unit: unit || '', desc: desc || ''});
  }
  return {vals, rows};
}
const BENCH_DOF = {Ux: 0, Uy: 1, Uz: 2, Rx: 3, Ry: 4, Rz: 5}, BENCH_REAC = {Fx: 0, Fy: 1, Fz: 2, Mx: 3, My: 4, Mz: 5};
const BENCH_SCALE = {N: 1e3, Vy: 1e3, Vz: 1e3, T: 1e6, Mz: 1e6, My: 1e6, vy: 1, vz: 1, ux: 1};
function benchProgram(st, R, ref) {
  const c = ref.c || 0, f = st.combos[c].f;
  switch (ref.k) {
    case 'disp': return nodeDisp(R, R.idx.get(ref.n), f)[BENCH_DOF[ref.d]];
    case 'reac': return nodeReac(R, R.idx.get(ref.n), f)[BENCH_REAC[ref.d]];
    case 'reacsum': return ref.ns.reduce((s, n) => s + nodeReac(R, R.idx.get(n), f)[BENCH_REAC[ref.d]], 0);
    case 'mem': {
      const mr = R.mrec.find(r => r.m.id === ref.m), S = memberStations(R, mr, f, 801), x = ref.x * mr.L;
      let bi = 0, bd = Infinity; S.x.forEach((xx, i) => { const d = Math.abs(xx - x); if (d < bd) { bd = d; bi = i; } });
      return S[ref.f][bi] / BENCH_SCALE[ref.f];
    }
    case 'cap': { const rec = R.checks.find(q => q.id === ref.m); return rec.cap[ref.f] / (/^phiM/.test(ref.f) ? 1e6 : (ref.f === 'lam' || ref.f === 'Mn_ratio' || ref.f === 'Q' || ref.f === 'Qs' || ref.f === 'Qa' || ref.f === 'Fe' || ref.f === 'Fcr') ? 1 : 1e3); }   // kN, kN·m, m (Lp, Lr), adimensional
    case 'celem': { const rec = R.checks.find(q => q.id === ref.m); return rec.cap.compElems[ref.i][ref.f]; }   // elemento de la sección en compresión: lam (b/t) o lr (límite de esbeltez)
    case 'finfo': { const rec = R.checks.find(q => q.id === ref.m); return rec.cap.flexInfo[ref.i][ref.f]; }   // elemento en flexión: lam, lp (compacta) o lr (no compacta)
    case 'sec': { const mr = R.mrec.find(r => r.m.id === ref.m); return mr.P[ref.f]; }   // propiedad geométrica de la sección (mm, mm², mm³, mm⁴, mm⁶)
    case 'util': { const rec = R.checks.find(q => q.id === ref.m); return ref.f ? rec.best[ref.f] : rec.r; }   // f: r (total), rH (axil+flexión), rV (corte)
    case 'weight': return R.weight;
  }
  throw new Error('comprobación desconocida: ' + ref.k);
}
const BENCH_COMBO0 = () => [{n: 'C1: 1,0·D', f: [1, 0, 0, 0], type: 'ULS'}];
function benchBuild(ex) {
  const {vals, rows} = benchParams(ex), m = ex.model(vals);
  const st = {name: ex.id + ' · ' + ex.titulo, nodes: m.nodes, members: m.members, customSections: m.customSections || {}, combos: m.combos || BENCH_COMBO0(), ver: m.ver || undefined,
    settings: Object.assign({E: vals.E || 200000, G: vals.G || 77200, Fy: vals.Fy || 235, selfWeight: false}, m.settings || {})};
  return {vals, rows, st};
}
// compara cada comprobación del ejercicio contra los resultados R de un modelo st (el de la corrida o el que está en el lienzo)
function benchCompare(ex, vals, st, R) {
  return ex.checks.map(c => {
    let theory = benchEval(c.t, vals), prog = benchProgram(st, R, c.ref);
    if (c.abs) { theory = Math.abs(theory); prog = Math.abs(prog); }
    const diff = prog - theory, tol = c.tol != null ? c.tol : (ex.tol != null ? ex.tol : 1e-4), atol = c.atol != null ? c.atol : 1e-6;
    return {label: c.l, unit: c.u || '', expr: c.t, abs: !!c.abs, theory, program: prog, diff, err: Math.abs(theory) > 1e-12 ? diff / theory : null, tol, atol, ok: Math.abs(diff) <= Math.max(tol * Math.abs(theory), atol), note: c.note || '', pub: !!c.pub};
  });
}
function runBench(ex) {
  const b = benchBuild(ex), st = b.st, res = {ex, params: b.rows, vals: b.vals, st, ok: false, rows: [], pass: false};
  const R = analyzeModel(st);
  if (!R.ok) { res.error = R.error; return res; }
  checkAll(st, R); res.ok = true;
  res.rows = benchCompare(ex, b.vals, st, R);
  res.pass = res.rows.every(r => r.ok);
  return res;
}
function runBenchAll() { return BENCH.map(runBench); }

const flexChain = () => [
  ['Mp', 'Fy*Zs', 'N·mm', 'Momento plástico Mp = Fy·Zs'], ['Lp', '1.76*rw*SQRT(E/Fy)', 'mm', 'Longitud límite plástica Lp = 1,76·rw·√(E/Fy)'], ['FL', 'Fy-69', 'MPa', 'FL = Fy − 69 MPa'],

const bxNum = v => { if (v == null || !isFinite(v)) return '—'; if (v === 0) return '0'; const a = Math.abs(v); return (a >= 1e6 || a < 1e-3 ? v.toExponential(4) : String(+v.toPrecision(7))).replace('.', ','); };
const bxErr = q => {
  if (q.err == null) return 'Δ ' + bxNum(q.diff);
  if (Math.abs(q.err) < 5e-7) return '0,0000 %';
  return (q.err > 0 ? '+' : '') + (q.err * 100).toFixed(4).replace('.', ',') + ' %';
};
const bxTol = q => (Math.abs(q.theory) < 1e-9 || q.tol <= 0) ? '± ' + bxNum(q.atol) + ' (abs.)' : '± ' + bxNum(q.tol * 100) + ' %';

}
const bxOrder = () => { const o = BX_GROUPS.map(g => g[0]); return BENCH.slice().sort((a, b) => o.indexOf(a.grupo) - o.indexOf(b.grupo) || (a.id > b.id ? 1 : -1)); };
function bxPill(r) { return r.ok ? (r.pass ? '<span class="pill ok">verifica</span>' : '<span class="pill bad">difiere</span>') : '<span class="pill bad">error</span>'; }
function bxTable(rows) {
  let h = `<div class="tw"><table class="t"><thead><tr><th class="l">Comprobación</th><th class="l">Unidad</th><th>Teoría / publicado</th><th>Programa</th><th>Diferencia</th><th>Tolerancia</th><th class="l">Estado</th></tr></thead><tbody>`;
  rows.forEach(q => {
    h += `<tr><td class="l" style="white-space:normal;min-width:240px">${esc(q.label)}${q.pub ? ' <span class="pill warn" title="Valor impreso en la fuente">publicado</span>' : ''}</td><td class="l">${esc(q.unit)}</td><td>${bxNum(q.theory)}</td><td>${bxNum(q.program)}</td><td>${bxErr(q)}</td><td>${bxTol(q)}</td><td class="l"><span class="pill ${q.ok ? 'ok' : 'bad'}">${q.ok ? 'OK' : 'NO'}</span></td></tr>`;
    if (q.note) h += `<tr><td class="l" colspan="7" style="white-space:normal;color:var(--muted);font-size:10px;padding-top:0">${esc(q.note)}</td></tr>`;
  });
  return h + '</tbody></table></div>';
}
function bxSource(ex) { const s = ex.fuente || {}; return s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(s.t)}</a>` : esc(s.t || ''); }
function bxDetail(ex, r) {
  const gl = {apuntes: 'Resultado publicado', clasico: 'Solución clásica', reglamento: 'Fórmulas del Reglamento'}[ex.grupo];
  let h = `<div class="bx-title"><span class="bx-id">${esc(ex.id)}</span><b>${esc(ex.titulo)}</b> ${bxPill(r)}</div>`;
  h += `<div class="note"><b>${gl}.</b> Fuente: ${bxSource(ex)}</div><p>${esc(ex.enunciado)}</p>`;
  if (ex.perfil) h += `<div class="note">${esc(ex.perfil)}</div>`;
  if (!r.ok) return h + `<div class="msg bad">${esc(r.error || 'No se pudo calcular el modelo del ejercicio')}</div>`;
  const np = r.rows.filter(q => q.ok).length;
  h += `<div class="hdr">Comparación · ${np} de ${r.rows.length} comprobaciones dentro de tolerancia</div>` + bxTable(r.rows);
  h += `<div class="row" style="justify-content:flex-start;margin:12px 0"><button class="tb on" data-bx-load="${esc(ex.id)}">Cargar en el lienzo y calcular</button><button class="tb" data-bx-xls="${esc(ex.id)}">Excel de este ejercicio</button></div>`;
  h += `<details><summary style="cursor:pointer;color:var(--muted);font-size:11px;margin-bottom:8px">Datos del ejercicio y fórmulas (${r.params.length} valores)</summary><div class="tw"><table class="t"><thead><tr><th class="l">Dato</th><th>Valor</th><th class="l">Unidad</th><th class="l">Fórmula</th><th class="l">Descripción</th></tr></thead><tbody>` +
    r.params.map(p => `<tr><td class="l">${esc(p.name)}</td><td>${bxNum(p.value)}</td><td class="l">${esc(p.unit)}</td><td class="l">${p.expr ? '= ' + esc(p.expr) : ''}</td><td class="l" style="white-space:normal">${esc(p.desc)}</td></tr>`).join('') + `</tbody></table></div></details>`;
  h += `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--muted);font-size:11px">Expresiones de la «teoría» de cada fila</summary><div class="note" style="margin-top:6px;font-family:var(--mono);white-space:pre-wrap">` + r.rows.map(q => esc(q.label) + '  →  ' + esc(q.expr)).join('\n') + `</div></details>`;
  return h;
}
function renderBench() {
  if (!BX_RES) bxRunAll();
  const all = [...BX_RES.values()], rows = all.reduce((n, r) => n + r.rows.length, 0), okRows = all.reduce((n, r) => n + r.rows.filter(q => q.ok).length, 0), okEx = all.filter(r => r.ok && r.pass).length;
  const pubRows = all.reduce((n, r) => n + r.rows.filter(q => q.pub).length, 0);
  $('#bxSum').innerHTML = `<span class="pill ${okEx === all.length ? 'ok' : 'bad'}">${okEx} de ${all.length} ejercicios verifican</span> <span style="color:var(--muted);font-size:10px">${okRows} de ${rows} comprobaciones · ${pubRows} contra números publicados</span>`;
  let l = '';
  BX_GROUPS.forEach(([g, t, s]) => {
    const items = bxOrder().filter(e => e.grupo === g); if (!items.length) return;
    l += `<div class="bx-gh" title="${esc(s)}">${esc(t)}</div>`;
    items.forEach(e => { const r = BX_RES.get(e.id); l += `<div class="bx-it${e.id === UI.benchSel ? ' on' : ''}" data-bx="${esc(e.id)}"><span class="bx-id">${esc(e.id)}</span><span class="bx-t">${esc(e.titulo)}</span>${bxPill(r)}</div>`; });
  });
  $('#bxList').innerHTML = l;
  const ex = BENCH.find(e => e.id === UI.benchSel) || bxOrder()[0]; UI.benchSel = ex.id;
  $('#bxDet').innerHTML = bxDetail(ex, BX_RES.get(ex.id));
}
function openBench() { bxRunAll(); if (!UI.benchSel) UI.benchSel = UI.bench || bxOrder()[0].id; renderBench(); $('#benchDlg').hidden = false; }
function closeBench() { $('#benchDlg').hidden = true; }
async function bxLoad(id) {
  const ex = BENCH.find(e => e.id === id); if (!ex) return;
  if (state.nodes.length && !UI.bench && !(await confirmDlg('Cargar el ejercicio ' + id, 'Se reemplaza el modelo actual por el del ejercicio. Si lo necesitás, guardalo antes con el botón Guardar. ¿Continuar?'))) return;
  const b = benchBuild(ex);
  loadModelObj(clone(b.st), ex.id + ' · ' + ex.titulo); UI.bench = id; UI.showLoads = 'D'; UI.nextRTab = 'ver';
  closeBench(); runCalc(); toast('Ejercicio ' + id + ' cargado: resultados en la pestaña Verificación');
}
/* pestaña «Verificación»: compara el modelo que está en el lienzo (con sus resultados) contra la teoría del ejercicio */
function renderVerTab() {
  const ex = UI.bench && BENCH.find(e => e.id === UI.bench);
  if (!ex) return `<div class="empty">Esta pestaña compara los resultados del programa con los de un ejercicio de libro.<br>Abrí la lista de ejercicios y presioná «Cargar en el lienzo y calcular».<br><br><button class="tb on" data-bx-open>Ejercicios de verificación…</button></div>`;
  const R = UI.results;
  if (!R) return `<div class="empty">Ejercicio ${esc(ex.id)} cargado. Presioná <b>▶ Calcular</b> para ver la comparación.</div>`;
  let rows, err = null;
  try { rows = benchCompare(ex, benchParams(ex).vals, state, R); } catch (e) { err = e.message; }
  if (err) return `<div class="msg bad">El modelo del lienzo ya no corresponde al ejercicio ${esc(ex.id)} (${esc(err)}). Volvé a cargarlo desde la lista.</div><div style="margin-top:8px"><button class="tb on" data-bx-open>Ejercicios de verificación…</button></div>`;
  const ok = rows.every(q => q.ok), np = rows.filter(q => q.ok).length;
  let h = (resultsFresh() ? '' : `<div class="msg warn" style="margin-bottom:8px">El modelo cambió desde el último cálculo: presioná ▶ Calcular para actualizar la comparación.</div>`);
  h += `<div class="bx-title"><span class="bx-id">${esc(ex.id)}</span><b>${esc(ex.titulo)}</b> <span class="pill ${ok ? 'ok' : 'bad'}">${ok ? 'el programa coincide con la teoría' : 'hay diferencias'}</span> <span style="color:var(--muted);font-size:10px">${np} de ${rows.length} comprobaciones</span></div>`;
  h += `<div class="note" style="margin-bottom:8px"><b>Fuente:</b> ${bxSource(ex)}<br>${esc(ex.enunciado)}</div>` + bxTable(rows) + `<div style="margin-top:8px"><button class="tb" data-bx-open>Lista de ejercicios…</button></div>`;
  return h;
}
/* exportación a Excel (valores; el informe con fórmulas vivas se entrega aparte) */
function bxExport(only) {
  if (!BX_RES) bxRunAll();
  const list = bxOrder().filter(e => !only || e.id === only), res = [['ID', 'Grupo', 'Ejercicio', 'Fuente', 'Enlace', 'Comprobaciones', 'Dentro de tolerancia', 'Estado']], det = [['ID', 'Comprobación', 'Unidad', 'Expresión de la teoría', 'Teoría / publicado', 'Programa', 'Diferencia', 'Error %', 'Tolerancia', 'Estado', 'Publicado en la fuente', 'Nota']];
  list.forEach(e => { const r = BX_RES.get(e.id); res.push([e.id, e.grupo, e.titulo, (e.fuente || {}).t || '', (e.fuente || {}).url || '', r.rows.length, r.rows.filter(q => q.ok).length, r.ok && r.pass ? 'verifica' : 'difiere']);
    r.rows.forEach(q => det.push([e.id, q.label, q.unit, q.expr, q.theory, q.program, q.diff, q.err == null ? '' : q.err * 100, bxTol(q), q.ok ? 'OK' : 'NO', q.pub ? 'sí' : '', q.note])); });
  const name = 'Verificacion_Atlas' + (only ? '_' + only : '');
  if (typeof XLSX === 'undefined') { const csv = det.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n'); download(name + '.csv', new Blob(['﻿' + csv], {type: 'text/csv'})); toast('Sin la librería Excel: se exportó CSV'); return; }
  const wb = XLSX.utils.book_new();
  [['Resumen', res], ['Detalle', det]].forEach(([n, a]) => { const ws = XLSX.utils.aoa_to_sheet(a); ws['!cols'] = a[0].map((_, k) => ({wch: Math.min(60, Math.max(10, ...a.slice(0, 60).map(r => String(r[k] == null ? '' : r[k]).length)))})); XLSX.utils.book_append_sheet(wb, ws, n); });
  XLSX.writeFile(wb, name + '.xlsx'); toast('Excel de verificación exportado');
}
$('#benchBtn').onclick = openBench;
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-bx-open]')) { openBench(); return; }
  const it = t.closest('#bxList [data-bx]'); if (it) { UI.benchSel = it.dataset.bx; renderBench(); $('#bxDet').scrollTop = 0; return; }
  const ld = t.closest('[data-bx-load]'); if (ld) { bxLoad(ld.dataset.bxLoad); return; }
  const xl = t.closest('[data-bx-xls]'); if (xl) { bxExport(xl.dataset.bxXls); return; }
  if (t.id === 'bxClose' || t.id === 'benchDlg') closeBench();
  if (t.id === 'bxXls') bxExport(null);
  if (t.id === 'bxRerun') { bxRunAll(); renderBench(); toast('Ejercicios recalculados con el motor actual'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#benchDlg').hidden && $('#dlg').hidden) closeBench(); });


</script>
